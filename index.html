<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluviómetro IoT · EET 3169</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--primary:#0ea5e9;--primary-dark:#0284c7;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--success:#10b981;--danger:#ef4444;--border:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.header{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:1rem 1.5rem;box-shadow:0 4px 20px rgba(14,165,233,.25)}
.header-content{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.header-text h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.header-text p{opacity:.9;font-size:.9rem;margin-top:.2rem}
.logo{height:144px;width:auto;border-radius:8px;background:rgba(255,255,255,.95);padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.container{max-width:900px;margin:0 auto;padding:1.25rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin:1.5rem 0}
.kpi{background:var(--card);border-radius:16px;padding:1.25rem;box-shadow:0 4px 20px rgba(0,0,0,.04);border:1px solid var(--border);text-align:center}
.kpi .label{font-size:.8rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi .value{font-size:1.9rem;font-weight:700;color:var(--primary-dark);margin:.35rem 0}
.kpi .unit{font-size:.85rem;color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.04);border:1px solid var(--border);margin-bottom:1.5rem}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:1rem}
.status-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem;font-size:.9rem}
.status-dot{display:inline-flex;align-items:center;gap:.4rem;font-weight:500}
.status-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.status-dot.offline::before{background:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.battery-wrap{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;font-weight:500}
.battery-icon{width:28px;height:14px;border:2px solid currentColor;border-radius:3px;position:relative;padding:1px}
.battery-icon::after{content:'';position:absolute;right:-5px;top:2px;width:3px;height:6px;background:currentColor;border-radius:0 2px 2px 0}
.battery-level{height:100%;border-radius:1px;transition:width .3s,background .3s}
.battery-level.ok{background:#10b981}
.battery-level.mid{background:#f59e0b}
.battery-level.low{background:#ef4444}
.btn{background:var(--danger);color:#fff;border:none;padding:.6rem 1.2rem;font-size:.9rem;font-weight:600;border-radius:10px;cursor:pointer}
.btn-download{background:#059669}
.btn-group{display:flex;gap:.6rem;flex-wrap:wrap}
canvas{width:100%!important;max-height:340px}
.footer{text-align:center;padding:1.5rem;font-size:.8rem;color:var(--muted)}
@media(max-width:600px){.header-content{flex-direction:column;text-align:center}.logo{height:120px}.header-text h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="header">
  <div class="header-content">
    <div class="header-text">
      <h1>Pluviómetro IoT</h1>
      <p>Estación Meteorológica · EET N° 3169 Campo Santo</p>
    </div>

<img src="logo_1.png" alt="Descripción de la imagen" width="220" height="200">
  </div>
</div>
<div class="container">
  <div class="status-bar">
    <div class="status-dot" id="status">Conectando...</div>
    <div class="battery-wrap" id="batteryWrap" title="Nivel de la batería LiPo">
      <span style="color:var(--muted);font-size:0.8rem;font-weight:600;">Batería</span>
      <div class="battery-icon"><div class="battery-level ok" id="batteryLevel" style="width:0%"></div></div>
      <span id="batteryText">--%</span>
    </div>
    <div style="color:var(--muted)" id="timestamp">—</div>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="label">Acumulado Total</div><div class="value" id="mmTotal">--</div><div class="unit">mm</div></div>
    <div class="kpi"><div class="label">Hoy</div><div class="value" id="mmHoy">--</div><div class="unit">mm</div></div>
    <div class="kpi"><div class="label">Últimos 7 días</div><div class="value" id="mm7">--</div><div class="unit">mm</div></div>
    <div class="kpi"><div class="label">Días con lluvia</div><div class="value" id="diasLluvia">--</div><div class="unit">días</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.75rem">
      <h2 style="margin:0">Histórico de Precipitación</h2>
      <div class="btn-group">
        <button class="btn btn-download" onclick="descargarCSV()">Descargar CSV</button>
      </div>
    </div>
    <canvas id="graficoLluvia"></canvas>
  </div>
</div>
<div class="footer">Desarrollado en la EET N° 3169 Galileo Galilei · Campo Santo</div>
<script>
// ========== CONFIGURACIÓN ==========
// Pegá aquí la URL de lectura de tu bin en JSONBin.io
// Ejemplo: https://api.jsonbin.io/v3/b/TU_BIN_ID/latest
const DATA_URL = "https://api.jsonbin.io/v3/b/6acaa347ac6210605a2651a0/latest";
// Si el bin es privado, poné la X-Access-Key (solo lectura). Si es público, dejá vacío.
const READ_KEY = "$2a$10$XP.7O/sWbpykAFHrY4si1uLAjvUft3DcMkRTL6wnvO6.OJnh2bNAS";
// ===================================

let miGrafico = null;
let ultimoHistorial = [];

function inicializarGrafico() {
  const ctx = document.getElementById('graficoLluvia').getContext('2d');
  miGrafico = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [],
      datasets: [{
        label: 'mm',
        data: [],
        backgroundColor: 'rgba(14,165,233,0.75)',
        borderColor: 'rgba(2,132,199,1)',
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#0f172a', padding: 10, cornerRadius: 8 }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 }, color: '#64748b' } },
        y: { beginAtZero: true, grid: { color: '#e2e8f0' }, ticks: { font: { size: 11 }, color: '#64748b' }, title: { display: true, text: 'mm', color: '#64748b' } }
      }
    }
  });
}

function actualizarDatos() {
  const headers = { "Content-Type": "application/json" };
  if (READ_KEY) headers["X-Access-Key"] = READ_KEY;

  fetch(DATA_URL, { headers })
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(payload => {
      const data = payload.record || payload;

      // Detectar si el ESP sigue transmitiendo
      // Se considera ONLINE si el ultimo envio tiene menos de 3 minutos
      const ahora = Math.floor(Date.now() / 1000);
      const epoch = Number(data.epoch || 0);
      const online = epoch > 100000 && (ahora - epoch) < 180; // 3 minutos

      const statusEl = document.getElementById("status");
      if (online) {
        statusEl.classList.remove("offline");
        statusEl.innerText = "Sistema Online";

        document.getElementById("mmTotal").innerText = Number(data.mmAcumulado || 0).toFixed(1);
        document.getElementById("mmHoy").innerText = Number(data.mmHoy || 0).toFixed(1);
        document.getElementById("mm7").innerText = Number(data.mm7 || 0).toFixed(1);
        document.getElementById("diasLluvia").innerText = data.diasLluvia || 0;
        document.getElementById("timestamp").innerText = data.timestamp || "—";

        const pct = Number(data.bateria || 0);
        const batEl = document.getElementById("batteryLevel");
        document.getElementById("batteryText").innerText = pct + "%";
        batEl.style.width = pct + "%";
        batEl.className = "battery-level " + (pct > 50 ? "ok" : pct > 20 ? "mid" : "low");
      } else {
        statusEl.classList.add("offline");
        statusEl.innerText = "Sistema fuera de línea";
        document.getElementById("batteryText").innerText = "No disponible";
        document.getElementById("batteryLevel").style.width = "0%";
        document.getElementById("batteryLevel").className = "battery-level low";
        // Se mantienen los ultimos valores de lluvia/timestamp si existen
        if (data.timestamp) document.getElementById("timestamp").innerText = data.timestamp + " (último dato)";
      }

      ultimoHistorial = data.historial || [];
      // Para el grafico: ultimos 90 dias si hay muchos
      const paraGrafico = ultimoHistorial.slice(-90);
      miGrafico.data.labels = paraGrafico.map(h => {
        // mostrar DD/MM en el grafico
        const p = (h.fecha || "").split("/");
        return p.length >= 2 ? (p[0] + "/" + p[1]) : (h.fecha || "-");
      });
      miGrafico.data.datasets[0].data = paraGrafico.map(h => h.mm);
      miGrafico.update("none");
    })
    .catch(err => {
      console.error(err);
      const statusEl = document.getElementById("status");
      statusEl.classList.add("offline");
      statusEl.innerText = "Sistema fuera de línea";
      document.getElementById("batteryText").innerText = "No disponible";
      document.getElementById("batteryLevel").style.width = "0%";
      document.getElementById("batteryLevel").className = "battery-level low";
    });
}

function descargarCSV() {
  if (!ultimoHistorial.length) {
    alert("No hay datos para descargar todavía.");
    return;
  }
  // Formato: Fecha DD/MM/AAAA, mm/dia, Acumulado
  let csv = "Fecha,mm/dia,Acumulado\n";
  ultimoHistorial.forEach(h => {
    if (!h.fecha || h.fecha === "-") return;
    const mm = Number(h.mm || 0).toFixed(2);
    const acum = Number(h.acumulado != null ? h.acumulado : h.mm || 0).toFixed(2);
    csv += h.fecha + "," + mm + "," + acum + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pluviometro_eet3169.csv";
  a.click();
  URL.revokeObjectURL(url);
}

window.onload = function () {
  inicializarGrafico();
  actualizarDatos();
  setInterval(actualizarDatos, 10000); // cada 10 s
};
</script>
</body>
</html>
